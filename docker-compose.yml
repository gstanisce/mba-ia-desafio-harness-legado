# Um Postgres para todas as cópias do Balcão. O nome fixo do projeto faz as
# worktrees compartilharem este container; cada cópia usa o seu próprio banco.
name: balcao

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: balcao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
